<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wave — cidade preenchida</title><style>body{background:#101c26;color:#e5ecea;font:16px system-ui;margin:24px}main{max-width:1280px;margin:auto}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button{background:#2b4b40;color:white;padding:10px;border:0;border-radius:5px;cursor:pointer}img{width:100%}p{line-height:1.5}</style><main><h1>Wave · detalhes da cidade e mapa</h1><nav></nav><img id="picture" alt="Cidade piloto"><p>Capturas no perfil Equilibrado. O mapa é a interface real do jogo. As vistas de inspeção desativam neblina e cortes de distância; a saída usa a câmera e o HUD normais. FPS não medido.</p></main><script>for(const [file,name] of [['driving-spawn','Saída'],['full-map','Mapa completo'],['gardens','Jardins'],['aurora','Aurora'],['skyline','Horizonte'],['central-park','Parques'],['tree-front','Árvores'],['tree-species-0','Copa ampla'],['tree-species-1','Esbelta'],['tree-species-2','Colunar'],['tree-species-3','Flor dourada'],['tree-species-4','Flor violeta'],['tree-species-5','Copa irregular'],['downtown-night','Noite'],['package-driving-day','Build · dia'],['package-driving-night','Build · noite'],['package-full-map','Build · mapa']]){let b=document.createElement('button');b.textContent=name;b.onclick=()=>picture.src=file+'.png';document.querySelector('nav').append(b)}document.querySelector('button').click()</script></html>
